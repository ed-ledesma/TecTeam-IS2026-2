{% extends "base.html" %}

{% block title %}Registro de alumno{% endblock %}
{% block page_class %}centered{% endblock %}

{% block content %}
<section class="card narrow">
    <h1>Registro de alumno</h1>
    <p class="muted">
        Crea tu cuenta en el Sistema de Gestión de Cursos de Idiomas.
    </p>

    <form
        action="{{ url_for('login.registro') }}"
        method="POST"
        class="grid"
        style="margin-top: 24px;"
    >
        <div>
            <label for="nombres">Nombre(s)</label>
            <input
                id="nombres"
                type="text"
                name="nombres"
                required
            >
        </div>

        <div>
            <label for="apellido_paterno">Apellido paterno</label>
            <input
                id="apellido_paterno"
                type="text"
                name="apellido_paterno"
                required
            >
        </div>

        <div>
            <label for="apellido_materno">Apellido materno</label>
            <input
                id="apellido_materno"
                type="text"
                name="apellido_materno"
                required
            >
        </div>

        <div>
            <label for="fecha_nacimiento">Fecha de nacimiento</label>
            <input
                id="fecha_nacimiento"
                type="date"
                name="fecha_nacimiento"
                required
            >
        </div>

        <div>
            <label for="correo">Correo</label>
            <input
                id="correo"
                type="email"
                name="correo"
                placeholder="correo@ejemplo.com"
                required
            >
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input
                id="password"
                type="password"
                name="password"
                required
            >
        </div>

        <button class="button" type="submit">
            Crear cuenta
        </button>
    </form>

    <a href="/login" class="button" style="margin-top: 12px; display: block; text-align: center;"> Volver </a>
</section>
{% endblock %}
