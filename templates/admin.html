<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #1f2937;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.panel {
    background: #111827;
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    width: 350px;
}

h2 {
    color: #fbbf24;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    margin: 10px 0;
}

a {
    text-decoration: none;
    color: white;
    background: #374151;
    padding: 10px;
    display: block;
    border-radius: 6px;
}

a:hover {
    background: #4b5563;
}
</style>
</head>

<body>
<div class="panel">
    <h2>👑 Admin Panel</h2>
    <p>Bienvenido, administrador</p>

    <br>
    <a href="/logout">Cerrar sesión</a>
</div>
</body>
</html>
