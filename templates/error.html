<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Error</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #ffe6e6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.error-box {
    background: white;
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h2 {
    color: #e74c3c;
}

a {
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    background: #e74c3c;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
}
</style>
</head>

<body>
<div class="error-box">
    <h2>❌ Error de login</h2>
    <p>Usuario o contraseña incorrectos</p>

    <a href="/logout">Volver al login</a>
</div>
</body>
</html>
