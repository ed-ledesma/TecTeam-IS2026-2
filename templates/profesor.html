<!DOCTYPE html>
<html lang="es">
<head>

<title>Bienvenido</title>

<style>

    margin: 0;
    font-family: Arial;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h2 {
    color: #2ecc71;
}

a {
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    background: #667eea;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
}
</style>
</head>

<body>
<div class="card">
    <h2>✔ Login exitoso</h2>
    <p>Bienvenido, profesor 👋</p>

    <a href="/logout">Cerrar sesión</a>
</div>

</html>
